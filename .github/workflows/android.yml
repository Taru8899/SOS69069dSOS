name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use logo as app icon if it exists
        run: |
          if [ -f assets/logo.png ]; then
            cp assets/logo.png android/icon.png
            sed -i '/^\[app\]/a icon.filename = %(source.dir)s/icon.png' android/buildozer.spec
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev build-essential

      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "cython<3" virtualenv

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v2-${{ hashFiles('android/buildozer.spec') }}

      - name: Build APK
        working-directory: android
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: dsos-apk
          path: android/bin/*.apk
