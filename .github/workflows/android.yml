name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare logo (icon + splash)
        run: |
          if [ -f assets/logo.png ]; then
            cp assets/logo.png android/logo.png
          else
            echo "::warning::assets/logo.png not found - building with the default icon"
            sed -i '/logo.png/d;/presplash_color/d' android/buildozer.spec
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          # The Azure mirror is sometimes unreachable: use the main Ubuntu mirror and retry
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 && \
               sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
                 git zip unzip autoconf automake libtool \
                 pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
                 libltdl-dev build-essential; then
              ok=1; break
            fi
            echo "apt failed (attempt $i), retrying in 20s"; sleep 20
          done
          [ "$ok" = 1 ] || exit 1

      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "cython<3" virtualenv

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v2-${{ hashFiles('android/buildozer.spec') }}

      - name: Build APK
        working-directory: android
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: dsos-apk
          path: android/bin/*.apk
